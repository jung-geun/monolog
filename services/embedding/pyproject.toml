[project]
name = "monolog-embedding"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.0",
  "uvicorn==0.54.0",
  "transformers==5.19.0",
  "torch==2.14.1",
]

[tool.uv]
package = false
required-version = "==0.10.11"
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
