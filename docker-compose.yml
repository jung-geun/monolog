services:


  blog:
    image: ghcr.io/jung-geun/monolog:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NOTION_TOKEN: ${NOTION_TOKEN:?required}
      NOTION_DATASOURCE_ID: ${NOTION_DATASOURCE_ID:?required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?required}
      TRUSTED_PROXY_HOPS: "1"
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?required}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - logs-data:/app/logs
      - image-cache:/app/.image-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: blog-qdrant
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  logs-data:
  image-cache:
  redis-data:
  qdrant-storage:
