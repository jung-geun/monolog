services:


  blog:
    image: ghcr.io/jung-geun/monolog:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NOTION_TOKEN: ${NOTION_TOKEN:?required}
      NOTION_DATASOURCE_ID: ${NOTION_DATASOURCE_ID:?required}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?required}
      TRUSTED_PROXY_HOPS: "1"
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:?required}
      REDIS_URL: redis://redis:6379
      CONTENT_REDIS_URL: redis://content-redis:6379
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SERVICE_URL: http://embedding:8000
    depends_on:
      redis:
        condition: service_healthy
      content-redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - logs-data:/app/logs
      - image-cache:/app/.image-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Durable content authority. AOF is enabled from its first boot; enabling AOF
  # on the existing cache Redis by restart would discard its RDB dataset.
  content-redis:
    image: redis:7.4-alpine
    container_name: blog-content-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - content-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: blog-qdrant
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Private CPU-only text embeddings. The public model needs no API key.
  embedding:
    image: ghcr.io/jung-geun/monolog-embedding:latest
    build:
      context: ./services/embedding
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - embedding-model-cache:/models
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    # No host port: only blog and other containers on the Compose network can connect.
    # Readiness follows the initial Hub download AND actual CPU inference warmup.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30m

volumes:
  logs-data:
  image-cache:
  redis-data:
  content-redis-data:
  qdrant-storage:
  embedding-model-cache:
