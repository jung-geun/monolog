services:
  blog:
    image: ghcr.io/jung-geun/monolog:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NOTION_TOKEN: ${NOTION_TOKEN:-COPY_YOUR_NOTION_TOKEN_HERE}
      NOTION_DATASOURCE_ID: ${NOTION_DATASOURCE_ID:-COPY_YOUR_NOTION_DATASOURCE_ID_HERE}
      NEXT_PUBLIC_GOOGLE_MEASUREMENT_ID: ${NEXT_PUBLIC_GOOGLE_MEASUREMENT_ID:-COPY_YOUR_GOOGLE_MEASUREMENT_ID_HERE}
      # Must match the REVALIDATE_SECRET GitHub Actions secret
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-GENERATE_RANDOM_STRING_AND_PUT_HERE}
      REVALIDATE_HOURS: ${REVALIDATE_HOURS:-1}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - logs-data:/app/logs
      - image-cache:/app/.image-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: blog-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-storage:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-ec",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  logs-data:
  image-cache:
  redis-data:
  qdrant-storage:
