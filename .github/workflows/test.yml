name: Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for manual tests and builds
        type: choice
        required: true
        default: hosted
        options:
          - hosted
          - self-hosted

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: ${{ (github.event_name != 'workflow_dispatch' || inputs.runner != 'self-hosted') && 'yarn' || '' }}

      - name: Enable declared Yarn
        if: github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted'
        run: corepack enable && corepack install

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint
        continue-on-error: true

      - name: Run TypeScript type checking
        run: yarn type-check
        continue-on-error: true

      - name: Run Jest tests
        run: yarn test

      - name: Upload test coverage
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: Build Project
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: ${{ (github.event_name != 'workflow_dispatch' || inputs.runner != 'self-hosted') && 'yarn' || '' }}

      - name: Enable declared Yarn
        if: github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted'
        run: corepack enable && corepack install

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build
        env:
          NODE_ENV: production
