name: Reconcile site content

on:
  schedule:
    # Incremental reconciliation every 15 minutes; the engine schedules daily full scans.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: content-reconciliation
  cancel-in-progress: false

jobs:
  revalidate:
    name: Await content reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Call /api/cron/content
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${REVALIDATE_URL:-}" ] || [ -z "${REVALIDATE_SECRET:-}" ]; then
            echo "ERROR: secrets REVALIDATE_URL and REVALIDATE_SECRET are required"
            echo "  REVALIDATE_URL  — site base URL, e.g. https://your-site.com"
            echo "  REVALIDATE_SECRET — must match REVALIDATE_SECRET env var in the container"
            exit 1
          fi

          ENDPOINT="${REVALIDATE_URL%/}/api/cron/content"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --connect-timeout 15 --max-time 1000 \
            --retry 2 --retry-delay 10 --retry-max-time 2050 \
            --header "Authorization: Bearer ${REVALIDATE_SECRET}" \
            "$ENDPOINT"
          echo
          echo "Content reconciliation completed successfully"
